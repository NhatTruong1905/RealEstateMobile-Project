server.port=8080
server.forward-headers-strategy=framework

spring.application.name=real-estate-backend

spring.ai.openai.chat.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.model=gemini-3.1-flash-lite

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/realestate_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

spring.profiles.include=secret

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



# Approval mail is safe by default: fake delivery + worker stopped. Enable SMTP explicitly after migration.
property.mail.mode=${PROPERTY_MAIL_MODE:fake}
property.mail.worker-enabled=${PROPERTY_MAIL_WORKER_ENABLED:false}
property.mail.max-attempts=${PROPERTY_MAIL_MAX_ATTEMPTS:5}
property.mail.retry-seconds=${PROPERTY_MAIL_RETRY_SECONDS:60}
property.mail.poll-ms=${PROPERTY_MAIL_POLL_MS:10000}
property.mail.zone=${PROPERTY_MAIL_ZONE:Asia/Ho_Chi_Minh}
property.mail.property-url-prefix=${PROPERTY_URL_PREFIX:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

server.port=8080
server.forward-headers-strategy=framework

spring.application.name=real-estate-backend

spring.ai.openai.chat.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.model=gemini-3.1-flash-lite

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/realestate_db

spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

spring.profiles.include=secret

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

property.mail.mode=${PROPERTY_MAIL_MODE:fake}
property.mail.worker-enabled=${PROPERTY_MAIL_WORKER_ENABLED:false}
property.mail.max-attempts=${PROPERTY_MAIL_MAX_ATTEMPTS:5}
property.mail.retry-seconds=${PROPERTY_MAIL_RETRY_SECONDS:60}
property.mail.poll-ms=${PROPERTY_MAIL_POLL_MS:10000}
property.mail.zone=${PROPERTY_MAIL_ZONE:Asia/Ho_Chi_Minh}
property.mail.property-url-prefix=${PROPERTY_URL_PREFIX:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

storage.cleanup.enabled=${STORAGE_CLEANUP_ENABLED:true}
storage.cleanup.poll-ms=${STORAGE_CLEANUP_POLL_MS:60000}
storage.r2.account-id=1a395e9b0cd0fa78e99460108371a2dd
storage.r2.endpoint=https://1a395e9b0cd0fa78e99460108371a2dd.r2.cloudflarestorage.com
storage.r2.bucket=real-estate-media
storage.r2.public-base-url=https://pub-3a202c83324042f09a359ff8b934e8db.r2.dev

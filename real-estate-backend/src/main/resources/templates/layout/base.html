<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Trang Quản Trị Bất Động Sản</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #f4f7f9;
            overflow-x: hidden;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #ffffff;
            border-right: 1px solid #eaeaea;
            overflow-y: auto;
            z-index: 1000;
        }

        .main-wrapper {
            margin-left: 260px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            font-weight: 700;
            font-size: 1.25rem;
            color: #1a2b4c;
        }

        .sidebar-heading {
            font-size: 0.75rem;
            font-weight: 600;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 24px 24px 8px 24px;
        }

        .nav-link-custom {
            display: flex;
            align-items: center;
            color: #4a5568;
            padding: 10px 24px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
            margin: 4px 16px;
            border-radius: 8px;
        }

        .nav-link-custom i {
            font-size: 1.1rem;
            margin-right: 12px;
            color: #718096;
        }

        .nav-link-custom:hover {
            background-color: #f7fafc;
            color: #1a2b4c;
        }

        .nav-link-custom:hover i {
            color: #1a2b4c;
        }

        .nav-link-custom.active {
            background-color: #1a2b4c;
            color: #ffffff;
            box-shadow: 0 4px 6px rgba(26, 43, 76, 0.2);
        }

        .nav-link-custom.active i {
            color: #ffffff;
        }
    </style>
</head>

<body th:fragment="main(activeMenu, content)">

<aside class="sidebar shadow-sm">
    <div class="sidebar-brand gap-2">
        <div class="text-white rounded-3 d-flex align-items-center justify-content-center"
             style="width: 32px; height: 32px; background-color: #1a2b4c;">
            <span style="font-size: 1rem;">R</span>
        </div>
        RealEstate
    </div>

    <nav class="mt-2 mb-4">
        <div class="sidebar-heading">Workspace</div>
        <a th:href="@{/admin/}" class="nav-link-custom" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
            <i class="bi bi-house-door"></i> Dashboard
        </a>

        <div class="sidebar-heading">Quản lý Bất Động Sản</div>
        <a th:href="@{/admin/properties-list}" class="nav-link-custom"
           th:classappend="${activeMenu == 'property' ? 'active' : ''}">
            <i class="bi bi-building"></i> Tin đăng (BĐS)
        </a>
        <th:block sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/property-types-list}" class="nav-link-custom"
               th:classappend="${activeMenu == 'propertyType' ? 'active' : ''}">
                <i class="bi bi-tags"></i> Loại hình BĐS
            </a>
            <a th:href="@{/admin/property-categories-list}" class="nav-link-custom"
               th:classappend="${activeMenu == 'propertyCategory' ? 'active' : ''}">
                <i class="bi bi-grid"></i> Phân khúc
            </a>
        </th:block>

        <div class="sidebar-heading">Khách hàng & Đối tác</div>
        <a th:href="@{/admin/users-list}" class="nav-link-custom"
           th:classappend="${activeMenu == 'user' ? 'active' : ''}">
            <i class="bi bi-people"></i> Tài khoản
        </a>
        <a th:href="@{/admin/interactions-list}" class="nav-link-custom"
           th:classappend="${activeMenu == 'interaction' ? 'active' : ''}">
            <i class="bi bi-telephone"></i> Lịch sử liên hệ
        </a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/interaction-types-list}" class="nav-link-custom"
           th:classappend="${activeMenu == 'interactionType' ? 'active' : ''}">
            <i class="bi bi-chat-left-dots"></i> Loại tương tác
        </a>

        <th:block sec:authorize="hasRole('ADMIN')">
            <div class="sidebar-heading">Hệ thống</div>
            <a th:href="@{/admin/roles-list}" class="nav-link-custom"
               th:classappend="${activeMenu == 'role' ? 'active' : ''}">
                <i class="bi bi-shield-lock"></i> Vai trò
            </a>
            <a th:href="@{/admin/districts-list}" class="nav-link-custom"
               th:classappend="${activeMenu == 'district' ? 'active' : ''}">
                <i class="bi bi-map"></i> Quận / Huyện
            </a>
            <a th:href="@{/admin/wards-list}" class="nav-link-custom"
               th:classappend="${activeMenu == 'ward' ? 'active' : ''}">
                <i class="bi bi-geo-alt"></i> Phường / Xã
            </a>
        </th:block>
    </nav>
</aside>

<div class="main-wrapper">

    <header th:replace="~{layout/header :: header}"></header>

    <main class="flex-grow-1 p-4 p-md-5">
        <th:block th:replace="${content}"></th:block>
    </main>

    <footer th:replace="~{layout/footer :: footer}"></footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>

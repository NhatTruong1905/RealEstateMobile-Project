<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy Cập Bị Từ Chối | Hệ Thống BĐS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            max-width: 600px;
            width: 100%;
            border: none;
            background: #ffffff;
        }

        .error-img {
            max-width: 320px;
            height: auto;
            object-fit: contain;
        }

        .btn-navy {
            background-color: #1a2b4c;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .btn-navy:hover {
            background-color: #111d33;
            color: #ffffff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="error-container p-3">
    <div class="card error-card shadow-sm rounded-4 text-center p-4 p-sm-5">
        <div class="mb-4">
            <img src="https://img.freepik.com/free-vector/oops-404-error-with-broken-robot-concept-illustration_114360-5529.jpg?w=1060"
                 alt="Truy cập bị từ chối"
                 class="error-img img-fluid">
        </div>

        <h3 class="fw-bold text-dark mb-2">Không Có Quyền Truy Cập!</h3>
        <p class="text-muted mb-4 px-3" style="line-height: 1.6;">
            Rất tiếc, tài khoản của bạn không được cấp quyền để xem nội dung này. Vui lòng quay lại trang được chỉ định
            hoặc liên hệ Quản trị viên nếu bạn nghĩ đây là một sự nhầm lẫn.
        </p>

        <div class="d-flex justify-content-center gap-3">
            <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-3 px-4 py-2 fw-medium">
                <i class="bi bi-arrow-left me-1"></i> Quay lại
            </a>
            <a th:href="@{/admin/}" class="btn btn-navy rounded-3 px-4 py-2 fw-medium shadow-sm">
                <i class="bi bi-house-door me-1"></i> Trang chủ quản lý
            </a>
        </div>

    </div>
</div>

</body>
</html>

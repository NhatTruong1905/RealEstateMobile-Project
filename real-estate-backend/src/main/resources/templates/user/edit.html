<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head}">
    <title>Cập nhật Người Dùng</title>
</head>

<body th:replace="~{layout/base :: main('user', ~{:: #user-form-content})}">

<div id="user-form-content">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <a th:href="@{/admin/users-list}" class="text-decoration-none text-muted mb-2 d-inline-block"
               style="font-size: 0.85rem;">
                <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
            </a>
            <h3 class="fw-bold mb-0 text-dark"
                th:text="${user.id != null ? 'Cập Nhật Người Dùng' : 'Thêm Mới Người Dùng'}">
                Cập Nhật Thông Tin
            </h3>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">

                    <form id="formUser" th:action="@{/api/users}" th:object="${user}" method="post" enctype="multipart/form-data">

                        <input type="hidden" th:field="*{id}"/>

                        <div id="form-error" class="alert alert-danger mb-4"
                             style="display: none; font-size: 0.9rem;"></div>

                        <div class="row mb-5 justify-content-center">
                            <div class="col-12 text-center">
                                <div class="position-relative d-inline-block">
                                    <img id="avatarPreview"
                                         th:src="${user.avatar != null and !user.avatar.isEmpty() ? user.avatar : 'https://via.placeholder.com/150?text=Avatar'}"
                                         class="rounded-circle object-fit-cover border shadow-sm"
                                         style="width: 130px; height: 130px; background-color: #f8f9fa;" alt="Avatar Preview">

                                    <label for="avatarFile" class="position-absolute bottom-0 end-0 bg-white border rounded-circle p-2 shadow-sm" style="cursor: pointer; right: 5px !important; bottom: 5px !important;" title="Chọn ảnh đại diện">
                                        <i class="bi bi-camera-fill text-primary"></i>
                                    </label>

                                    <input type="file" id="avatarFile" name="avatarFile" class="d-none" accept="image/png, image/jpeg, image/jpg">
                                </div>
                                <div class="form-text small mt-2 text-muted">Định dạng: JPG, PNG. Tối đa 2MB.</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="username" class="form-label fw-bold text-dark">Tên đăng nhập (Username)
                                    <span class="text-danger">*</span></label>
                                <input type="text" class="form-control rounded-3 py-2" id="username"
                                       th:field="*{username}"
                                       placeholder="Nhập tên tài khoản..." required
                                       th:readonly="${user.id != null}"
                                       th:classappend="${user.id != null ? 'bg-light text-muted' : ''}">
                                <div class="form-text small text-muted mt-1" th:if="${user.id != null}">
                                    Không thể thay đổi username của tài khoản đã tạo.
                                </div>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold text-dark">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                                    <input type="text" class="form-control rounded-end-3 py-2 bg-light text-muted border-start-0"
                                           value="*** Mật khẩu mặc định ***" readonly>
                                </div>
                                <div class="form-text small text-primary mt-1" th:if="${user.id == null}">
                                    <i class="bi bi-info-circle me-1"></i>Hệ thống sẽ tự động cấp.
                                </div>
                            </div>

                            <div class="col-md-12 mb-4">
                                <label for="fullname" class="form-label fw-bold text-dark">Họ và Tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control rounded-3 py-2" id="fullname"
                                       th:field="*{fullname}" placeholder="Ví dụ: Nguyễn Văn A..." required>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label for="phone" class="form-label fw-bold text-dark">Số điện thoại</label>
                                <input type="text" class="form-control rounded-3 py-2" id="phone" th:field="*{phone}"
                                       placeholder="Nhập số điện thoại...">
                            </div>

                            <div class="col-md-6 mb-4">
                                <label for="email" class="form-label fw-bold text-dark">Email liên hệ</label>
                                <input type="email" class="form-control rounded-3 py-2" id="email" th:field="*{email}"
                                       placeholder="Ví dụ: email@domain.com...">
                            </div>

                            <div class="col-md-6 mb-4">
                                <label for="roleId" class="form-label fw-bold text-dark">Vai trò <span class="text-danger">*</span></label>
                                <select class="form-select rounded-3 py-2" id="roleId" th:field="*{roleId}" required>
                                    <option value="" disabled selected>-- Chọn vai trò --</option>
                                    <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}"></option>
                                </select>
                            </div>

                        </div>

                        <div class="d-flex gap-2 pt-3 border-top mt-2">
                            <button type="submit" class="btn px-4 py-2 fw-medium text-white rounded-3 shadow-sm"
                                    style="background-color: #1a2b4c;">
                                <i class="bi bi-save me-1"></i> Lưu thông tin
                            </button>

                            <button type="reset" class="btn btn-light px-4 py-2 fw-medium border rounded-3 shadow-none">
                                Làm mới
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Script xử lý tính năng Xem trước ảnh (Preview Image)
        document.getElementById('avatarFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Thay thế src của thẻ img bằng dữ liệu ảnh vừa chọn
                    document.getElementById('avatarPreview').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // 2. Script xử lý Submit Form
        document.getElementById("formUser").addEventListener("submit", function (event) {
            event.preventDefault();

            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            const csrfToken = formData.get('_csrf');

            const errorDiv = document.getElementById("form-error");
            errorDiv.style.display = "none";
            errorDiv.innerText = "";

            fetch(this.action, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': csrfToken
                },
                body: JSON.stringify(data)
            })
                .then(async response => {
                    const result = await response.json();

                    if (response.ok) {
                        alert(result.message || "Lưu thông tin thành công!");
                        window.location.href = "/admin/users-list";
                    } else {
                        if (result.message) {
                            errorDiv.innerText = result.message;
                            errorDiv.style.display = "block";
                        } else if (Array.isArray(result)) {
                            alert("LỖI DỮ LIỆU:\n" + result.join("\n"));
                        } else {
                            alert("Có lỗi không xác định xảy ra!");
                        }
                    }
                })
                .catch(error => {
                    console.error('Lỗi khi gọi API:', error);
                    alert("Không thể kết nối đến máy chủ, vui lòng thử lại sau!");
                });
        });
    </script>
</div>

</body>
</html>

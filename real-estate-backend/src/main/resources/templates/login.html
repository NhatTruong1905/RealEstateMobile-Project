<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head}">
    <title>Đăng nhập</title>
</head>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }
</style>

<body class="d-flex flex-column min-vh-100 bg-light">

<header class="shadow-sm py-3 px-4" style="background-color: #1a2b4c;">
    <h5 class="mb-0 fw-bold">
        <span class="text-white text-decoration-none">Trang Quản Trị Bất Động Sản</span>
    </h5>
</header>

<main class="flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="card p-4 p-md-5 shadow-sm border-0" style="width: 100%; max-width: 450px; border-radius: 12px;">
        <h4 class="text-center mb-4 fw-bold" style="color: #2c3e50;">Đăng nhập vào tài khoản</h4>

        <div th:if="${param.error}" class="alert alert-danger p-2 text-center small">Tài khoản hoặc mật khẩu không chính
            xác
        </div>
        <div th:if="${param.logout}" class="alert alert-success p-2 text-center small">Đã thoát hệ thống!</div>

        <form th:action="@{/admin/login}" method="post">

            <div class="mb-3">
                <label class="form-label fw-medium text-dark">Tài khoản</label>
                <input type="text" name="username" class="form-control rounded-3 py-2" placeholder="your@email.com"
                       required autofocus>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label fw-medium text-dark mb-0">Mật khẩu</label>
                </div>
                <div class="position-relative">
                    <input type="password" id="passwordInput" name="password" class="form-control rounded-3 py-2 pe-5"
                           placeholder="Mật khẩu của bạn" required>

                    <span class="position-absolute top-50 end-0 translate-middle-y pe-3"
                          style="cursor: pointer; color: #6c757d;" onclick="togglePassword()">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2001/svg" width="18" height="18" fill="currentColor"
                             class="bi bi-eye" viewBox="0 0 16 16">
                          <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                          <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-3 fw-medium py-2 text-white"
                    style="border: none;">Sign in
            </button>
        </form>
    </div>
</main>

<footer th:replace="~{layout/footer :: footer}"></footer>

<script>
    function togglePassword() {
        const pwdInput = document.getElementById('passwordInput');

        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
        } else {
            pwdInput.type = 'password';
        }
    }
</script>

</body>
</html>

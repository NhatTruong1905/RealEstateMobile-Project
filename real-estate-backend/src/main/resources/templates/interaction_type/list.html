<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head}">
    <title>Quản lý Loại Tương Tác</title>
</head>

<body th:replace="~{layout/base :: main('interactionType', ~{:: #interaction-type-content})}">

<div id="interaction-type-content">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <p class="text-uppercase text-muted fw-bold mb-1" style="font-size: 0.75rem; letter-spacing: 1px;">Khách hàng & Đối tác</p>
            <h3 class="fw-bold mb-0 text-dark">Quản Lý Loại Tương Tác</h3>
        </div>
        <div>
            <a th:href="@{/admin/interaction-types-edit}" class="btn text-white fw-medium shadow-sm rounded-3"
               style="background-color: #1a2b4c;">
                <i class="bi bi-plus-lg me-1"></i> Thêm loại tương tác
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="text-muted"
                           style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #eaeaea;">
                    <tr>
                        <th class="py-3" style="width: 10%;">#ID</th>
                        <th class="py-3" style="width: 25%;">Mã Code</th>
                        <th class="py-3" style="width: 45%;">Tên Loại Tương Tác</th>
                        <th class="py-3 text-center" style="width: 20%;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="i : ${interactionTypes}" style="border-bottom: 1px solid #f4f7f9;">
                        <td class="fw-bold text-dark" th:text="${i.id}"></td>

                        <td>
                            <span class="badge bg-light text-primary border px-2 py-1" style="font-size: 0.8rem; letter-spacing: 0.5px;"
                                  th:text="${i.code}">CODE</span>
                        </td>

                        <td class="fw-medium text-dark" th:text="${i.name}"></td>

                        <td class="text-center">
                            <a th:href="@{/admin/interaction-types-edit-{id}(id=${i.id})}"
                               class="btn btn-sm btn-light border shadow-none rounded-3 me-2 text-primary">
                                <i class="bi bi-pencil-square"></i> Sửa
                            </a>

                            <form th:action="@{/admin/api/interaction-types/{id}(id=${i.id})}" method="post" class="d-inline delete-interaction-form">
                                <button type="submit"
                                        class="btn btn-sm btn-light border shadow-none rounded-3 text-danger">
                                    <i class="bi bi-trash"></i> Xóa
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(interactionTypes)}">
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-chat-left-dots fs-1 d-block mb-2"></i>
                            Chưa có dữ liệu loại tương tác nào.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const deleteForms = document.querySelectorAll('.delete-interaction-form');

            deleteForms.forEach(form => {
                form.addEventListener('submit', function (event) {
                    event.preventDefault();

                    if (!confirm('Bạn có chắc chắn muốn xóa loại tương tác này không? Lịch sử liên hệ liên quan có thể bị ảnh hưởng.')) {
                        return;
                    }

                    const url = this.action;
                    const formData = new FormData(this);
                    const csrfToken = formData.get('_csrf');

                    fetch(url, {
                        method: 'DELETE',
                        headers: {
                            'X-CSRF-TOKEN': csrfToken
                        }
                    })
                        .then(response => {
                            if (response.ok) {
                                alert("Xóa thành công!");
                                window.location.reload();
                            } else {
                                alert("LỖI: Không thể xóa loại tương tác này (có thể đang có lịch sử sử dụng).");
                            }
                        })
                        .catch(error => {
                            console.error('Lỗi khi gọi API xóa:', error);
                            alert("Có lỗi xảy ra, vui lòng thử lại sau!");
                        });
                });
            });
        });
    </script>
</div>

</body>
</html>

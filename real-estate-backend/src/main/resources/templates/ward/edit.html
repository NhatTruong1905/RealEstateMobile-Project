<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head}">
    <title>Cập nhật Phường/Xã</title>
</head>

<body th:replace="~{layout/base :: main('ward', ~{:: #ward-form-content})}">

<div id="ward-form-content">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

    <style>
        .ts-wrapper.form-select {
            padding: 0 !important;
            border: none !important;
            background-image: none !important;
        }

        .ts-control {
            border: 1px solid #dee2e6 !important;
            border-radius: 0.5rem !important;
            padding: 0.5rem 0.75rem !important;
            font-size: 1rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .ts-wrapper.focus .ts-control {
            border-color: #1a2b4c !important;
            box-shadow: 0 0 0 0.25rem rgba(26, 43, 76, 0.25) !important;
        }

        .ts-dropdown {
            border-radius: 0.5rem !important;
            margin-top: 5px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
        }
    </style>

    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <a th:href="@{/admin/wards-list}" class="text-decoration-none text-muted mb-2 d-inline-block"
               style="font-size: 0.85rem;">
                <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
            </a>
            <h3 class="fw-bold mb-0 text-dark"
                th:text="${ward.id != null ? 'Cập Nhật Phường/Xã' : 'Thêm Mới Phường/Xã'}">
                Cập Nhật Thông Tin
            </h3>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">

                    <form id="formWard" th:action="@{/admin/api/wards}" th:object="${ward}" method="post">

                        <input type="hidden" th:field="*{id}"/>

                        <div id="form-error" class="alert alert-danger mb-4"
                             style="display: none; font-size: 0.9rem;"></div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="code" class="form-label fw-bold text-dark">Mã Code <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control rounded-3 py-2" id="code" th:field="*{code}"
                                       placeholder="Ví dụ: P1, XTT, TTNT..." required
                                       style="text-transform: uppercase;">

                                <div id="error-code" class="text-danger fst-italic small mt-1 error-message"
                                     style="display: none;"></div>
                                <div class="form-text small text-muted mt-1">Mã code phải là duy nhất.</div>
                            </div>

                            <div class="col-md-6 mb-4">
                                <label for="name" class="form-label fw-bold text-dark">Tên Phường/Xã <span
                                        class="text-danger">*</span></label>
                                <input type="text" class="form-control rounded-3 py-2" id="name" th:field="*{name}"
                                       placeholder="Ví dụ: Phường 1, Xã Tân Thạnh..." required>

                                <div id="error-name" class="text-danger fst-italic small mt-1 error-message"
                                     style="display: none;"></div>
                            </div>

                            <div class="col-md-12 mb-4">
                                <label for="districtId" class="form-label fw-bold text-dark">Thuộc Quận/Huyện <span
                                        class="text-danger">*</span></label>
                                <select id="districtId" th:field="*{districtId}"
                                        placeholder="Gõ để tìm kiếm Quận/Huyện..." required>
                                    <option value=""></option>
                                    <option th:each="d : ${districts}" th:value="${d.id}"
                                            th:text="${d.name} + ' (' + ${d.code} + ')'"></option>
                                </select>

                                <div id="error-districtId" class="text-danger fst-italic small mt-1 error-message"
                                     style="display: none;"></div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 pt-3 border-top mt-2">
                            <button type="submit" class="btn px-4 py-2 fw-medium text-white rounded-3 shadow-sm"
                                    style="background-color: #1a2b4c;">
                                <i class="bi bi-save me-1"></i> Lưu thông tin
                            </button>

                            <button type="reset" class="btn btn-light px-4 py-2 fw-medium border rounded-3 shadow-none">
                                Làm mới
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            new TomSelect("#districtId", {
                create: false,
                sortField: {
                    field: "text",
                    direction: "asc"
                },
                plugins: ['dropdown_input']
            });
        });

        document.getElementById("formWard").addEventListener("submit", function (event) {
            event.preventDefault();

            const formData = new FormData(this);
            if (formData.has('code')) {
                formData.set('code', formData.get('code').toUpperCase());
            }
            const data = Object.fromEntries(formData.entries());
            const csrfToken = formData.get('_csrf');

            const formErrorDiv = document.getElementById("form-error");
            formErrorDiv.style.display = "none";
            formErrorDiv.innerText = "";

            document.querySelectorAll('.error-message').forEach(function (el) {
                el.style.display = 'none';
                el.innerText = '';
            });

            fetch(this.action, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': csrfToken
                },
                body: JSON.stringify(data)
            })
                .then(async response => {
                    const result = await response.json();

                    if (response.ok) {
                        alert(result.message || "Lưu thành công!");
                        window.location.href = "/admin/wards-list";
                    } else {
                        if (result.message) {
                            formErrorDiv.innerText = result.message;
                            formErrorDiv.style.display = "block";
                        } else if (typeof result === 'object' && !Array.isArray(result)) {
                            for (const [field, errorMessage] of Object.entries(result)) {
                                const errorDiv = document.getElementById(`error-${field}`);
                                if (errorDiv) {
                                    errorDiv.innerText = errorMessage;
                                    errorDiv.style.display = "block";
                                }
                            }
                        } else if (Array.isArray(result)) {
                            alert("LỖI DỮ LIỆU:\n" + result.join("\n"));
                        } else {
                            alert("Có lỗi không xác định xảy ra!");
                        }
                    }
                })
                .catch(error => {
                    console.error('Lỗi khi gọi API:', error);
                    alert("Không thể kết nối đến máy chủ, vui lòng thử lại sau!");
                });
        });
    </script>
</div>

</body>
</html>

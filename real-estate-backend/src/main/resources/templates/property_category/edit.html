<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head}">
    <title>Cập nhật Phân khúc BĐS</title>
</head>

<body th:replace="~{layout/base :: main('propertyCategory', ~{:: #propertyCategory-form-content})}">

<div id="propertyCategory-form-content">

    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <a th:href="@{/admin/property-categories-list}" class="text-decoration-none text-muted mb-2 d-inline-block"
               style="font-size: 0.85rem;">
                <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
            </a>
            <h3 class="fw-bold mb-0 text-dark"
                th:text="${propertyCategory.id != null ? 'Sửa Phân Khúc BĐS' : 'Thêm Mới Phân Khúc BĐS'}">
                Cập nhật Phân Khúc
            </h3>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">

                    <form id="formPropertyCategory" th:action="@{/admin/api/property-categories}"
                          th:object="${propertyCategory}"
                          method="post">

                        <input type="hidden" th:field="*{id}"/>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-4">
                            <label for="code" class="form-label fw-bold text-dark">Mã phân khúc (Code) <span
                                    class="text-danger">*</span></label>
                            <input type="text" class="form-control rounded-3 py-2" id="code" th:field="*{code}"
                                   placeholder="Ví dụ: APARTMENT, HOUSE, VILLA..." required>
                            <div id="code-error" class="text-danger fst-italic mt-1"
                                 style="display: none; font-size: 0.85rem;"></div>
                        </div>

                        <div class="mb-4">
                            <label for="name" class="form-label fw-bold text-dark">Tên hiển thị <span
                                    class="text-danger">*</span></label>
                            <input type="text" class="form-control rounded-3 py-2" id="name" th:field="*{name}"
                                   placeholder="Ví dụ: Căn hộ chung cư, Nhà riêng, Biệt thự..." required>
                        </div>

                        <div class="d-flex gap-2 pt-3 border-top">
                            <button type="submit" class="btn px-4 py-2 fw-medium text-white rounded-3 shadow-sm"
                                    style="background-color: #1a2b4c;">
                                <i class="bi bi-save me-1"></i> Lưu thông tin
                            </button>

                            <button type="reset" class="btn btn-light px-4 py-2 fw-medium border rounded-3 shadow-none">
                                Hủy bỏ
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("formPropertyCategory").addEventListener("submit", function (event) {
            event.preventDefault();

            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            const csrfToken = formData.get('_csrf');
            delete data._csrf;

            const codeErrorDiv = document.getElementById("code-error");
            codeErrorDiv.style.display = "none";
            codeErrorDiv.innerText = "";

            fetch(this.action, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': csrfToken
                },
                body: JSON.stringify(data)
            })
                .then(async response => {
                    const result = await response.json();

                    if (response.ok) {
                        alert(result.message);
                        window.location.href = "/admin/property-categories-list";
                    } else {
                        if (result.message) {
                            codeErrorDiv.innerText = result.message;
                            codeErrorDiv.style.display = "block";
                        } else if (Array.isArray(result)) {
                            alert("LỖI DỮ LIỆU:\n" + result.join("\n"));
                        } else {
                            alert("Có lỗi không xác định xảy ra!");
                        }
                    }
                })
                .catch(error => {
                    console.error('Lỗi khi gọi API:', error);
                    alert("Có lỗi xảy ra, vui lòng thử lại sau!");
                });
        });
    </script>
</div>

</body>
</html>
